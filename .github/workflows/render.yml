name: Renderizar Vídeo

on:
  repository_dispatch:
    types: [gerar_video]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install -r requirements.txt

      - name: Executar Renderização
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python generate.py "${{ github.event.client_payload.roteiro }}" "${{ github.event.client_payload.formato }}" "$PEXELS_KEY" "${{ github.event.client_payload.estilo }}" "${{ github.event.client_payload.efeito }}" "$CF_ACCOUNT_ID" "$CF_API_TOKEN"

      - name: Publicar Vídeo no Repositório (para o Player do Site)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultado.mp4
          git commit -m "update: novo vídeo gerado" || exit 0
          git push origin main

      - name: Salvar Vídeo como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: video-pronto
          path: resultado.mp4

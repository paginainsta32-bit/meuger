<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Criar Vídeos AI</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 750px; margin: 30px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; font-size: 26px; }
    label { font-weight: 600; margin-top: 18px; display: block; color: #cbd5e1; font-size: 14px; }
    textarea, select, input, button { width: 100%; margin-top: 8px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    button { background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 16px; transition: 0.2s; padding: 14px; border-radius: 8px; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    #status { margin-top: 18px; font-weight: 600; text-align: center; color: #38bdf8; }
    .video-container { margin-top: 30px; display: none; text-align: center; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    video { width: 100%; max-height: 480px; border-radius: 8px; margin-top: 10px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎬 Estúdio de Vídeos AI</h2>
  
  <label for="roteiro">Roteiro (Separe cada cena por uma nova linha):</label>
  <textarea id="roteiro" rows="6" placeholder="Um garotinho corre alegremente pela floresta.&#10;Ele encontra um riacho mágico e cristalino.&#10;O menino sorri para o céu ensolarado."></textarea>
  <span class="hint">💡 Cada linha virará uma cena diferente com a foto no estilo escolhido!</span>

  <div class="grid">
    <div>
      <label for="estilo">🎨 Estilo Visual:</label>
      <select id="estilo">
        <option value="cartoon">Cartoon (Desenho 2D)</option>
        <option value="anime">Anime (Estilo Japonês)</option>
        <option value="3d">3D Animation (Pixar Style)</option>
        <option value="realista" selected>Realista (Fotografia Pexels)</option>
      </select>
    </div>
    
    <div>
      <label for="formato">📱 Formato do Vídeo:</label>
      <select id="formato">
        <option value="9:16">Vertical (TikTok / Reels - 9:16)</option>
        <option value="16:9">Horizontal (YouTube - 16:9)</option>
      </select>
    </div>
  </div>

  <div class="grid">
    <div>
      <label for="efeito">✨ Efeitos & Edição (CapCut Style):</label>
      <select id="efeito">
        <option value="zoom">Zoom Suave (Ken Burns)</option>
        <option value="vivido">Filtro Cores Vivas</option>
        <option value="vintage">Filtro Vintage / Retro</option>
        <option value="nenhum">Sem Efeitos</option>
      </select>
    </div>

    <div>
      <label for="token">🔑 GitHub Token (PAT):</label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
    </div>
  </div>

  <button onclick="dispararGeracao()">🚀 Gerar e Editar Vídeo</button>

  <div id="status"></div>

  <!-- Player de Vídeo Embutido -->
  <div id="videoContainer" class="video-container">
    <h3>🎥 Pré-visualização do Vídeo Final</h3>
    <video id="player" controls autoplay></video>
    <br>
    <a id="btnDownload" href="#" download="video_pronto.mp4" style="display:inline-block; margin-top:15px; padding:10px 20px; background:#22c55e; color:#fff; text-decoration:none; border-radius:6px; font-weight:bold;">⬇️ Baixar Vídeo MP4</a>
  </div>
</div>

<script>
  async function dispararGeracao() {
    const roteiro = document.getElementById('roteiro').value.trim();
    const estilo = document.getElementById('estilo').value;
    const formato = document.getElementById('formato').value;
    const efeito = document.getElementById('efeito').value;
    const token = document.getElementById('token').value.trim();
    const status = document.getElementById('status');
    const container = document.getElementById('videoContainer');

    if(!roteiro || !token) { 
      alert('Por favor, preencha o roteiro e insira o seu Token do GitHub!'); 
      return; 
    }

    status.innerHTML = "⏳ Enviando comando e gerando cenas...";
    container.style.display = "none";

    try {
      const response = await fetch('https://api.github.com/repos/paginainsta32-bit/meuger/dispatches', {
        method: 'POST',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          event_type: 'gerar_video',
          client_payload: { 
            roteiro: roteiro, 
            estilo: estilo, 
            formato: formato,
            efeito: efeito 
          }
        })
      });

      if(response.ok) {
        status.innerHTML = "⚙️ Processando vídeo no GitHub Actions... Aguarde cerca de 1 min.";
        iniciarVerificacao(token);
      } else {
        status.innerHTML = "❌ Erro de permissão. Verifique seu Token.";
      }
    } catch (e) {
      status.innerHTML = "❌ Erro de conexão: " + e.message;
    }
  }

  async function iniciarVerificacao(token) {
    const status = document.getElementById('status');
    const player = document.getElementById('player');
    const container = document.getElementById('videoContainer');
    const btnDownload = document.getElementById('btnDownload');

    let tentativas = 0;
    const interval = setInterval(async () => {
      tentativas++;
      status.innerHTML = `⏳ Renderizando efeitos e áudio... (${tentativas * 5}s)`;

      try {
        const res = await fetch('https://api.github.com/repos/paginainsta32-bit/meuger/actions/runs?per_page=1', {
          headers: { 'Authorization': `token ${token}` }
        });
        const data = await res.json();

        if (data.workflow_runs && data.workflow_runs.length > 0) {
          const run = data.workflow_runs[0];
          if (run.status === 'completed') {
            clearInterval(interval);
            if (run.conclusion === 'success') {
              status.innerHTML = "🎉 Vídeo gerado com sucesso!";
              
              // Carrega o vídeo gerado direto do GitHub Pages / Artefato
              const videoUrl = `https://raw.githubusercontent.com/paginainsta32-bit/meuger/main/resultado.mp4?t=${new Date().getTime()}`;
              player.src = videoUrl;
              btnDownload.href = videoUrl;
              container.style.display = "block";
            } else {
              status.innerHTML = "❌ Erro na renderização. Verifique os logs no GitHub Actions.";
            }
          }
        }
      } catch (err) {
        console.error(err);
      }

      if (tentativas >= 35) {
        clearInterval(interval);
        status.innerHTML = "⚠️ O tempo de espera expirou. Atualize a página ou confira na aba Actions.";
      }
    }, 5000);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Vídeo Automático</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f4f6f9; }
    .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; }
    label { font-weight: bold; margin-top: 15px; display: block; color: #555; }
    textarea, select, input, button { width: 100%; margin-top: 8px; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; }
    button { background: #0066ff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    button:hover { background: #0052cc; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    .video-container { margin-top: 25px; display: none; text-align: center; }
    video { width: 100%; max-height: 450px; border-radius: 8px; background: #000; margin-top: 10px; }
    .hint { font-size: 12px; color: #666; margin-top: 4px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎬 Gerador de Vídeo Automático</h2>
  
  <label for="roteiro">Seu Roteiro (Separe cada cena/frase por uma nova linha):</label>
  <textarea id="roteiro" rows="7" placeholder="Exemplo:&#10;Um garotinho corre alegremente pela floresta.&#10;Ele encontra um riacho com águas cristalinas.&#10;Ele sorri e olha para o céu ensolarado."></textarea>
  <span class="hint">💡 Cada linha virará uma foto diferente sincronizada com a fala!</span>

  <label for="formato">Formato do Vídeo:</label>
  <select id="formato">
    <option value="9:16">Vertical (TikTok / Reels / Shorts - 9:16)</option>
    <option value="16:9">Horizontal (YouTube - 16:9)</option>
  </select>

  <label for="token">Seu GitHub Personal Access Token (PAT):</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

  <button onclick="dispararGeracao()">🚀 Gerar Vídeo Agora</button>

  <div id="status"></div>

  <!-- Player de Vídeo Embutido -->
  <div id="videoContainer" class="video-container">
    <h3>📺 Seu Vídeo Gerado:</h3>
    <video id="player" controls></video>
  </div>
</div>

<script>
  async function dispararGeracao() {
    const roteiro = document.getElementById('roteiro').value.trim();
    const formato = document.getElementById('formato').value;
    const token = document.getElementById('token').value.trim();
    const status = document.getElementById('status');
    const container = document.getElementById('videoContainer');

    if(!roteiro || !token) { 
      alert('Por favor, preencha o roteiro e o seu Token do GitHub!'); 
      return; 
    }

    status.innerHTML = "⏳ Enviando roteiro e iniciando renderização...";
    container.style.display = "none";

    try {
      const response = await fetch('https://api.github.com/repos/paginainsta32-bit/meuger/dispatches', {
        method: 'POST',
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          event_type: 'gerar_video',
          client_payload: { roteiro: roteiro, formato: formato }
        })
      });

      if(response.ok) {
        status.innerHTML = "✅ Renderização em andamento no GitHub! Aguarde cerca de 1 a 2 minutos para assistir o vídeo aqui.";
        iniciarVerificacaoArtefato(token);
      } else {
        status.innerHTML = "❌ Erro ao disparar. Verifique se o Token está correto e com acesso 'repo'.";
      }
    } catch (e) {
      status.innerHTML = "❌ Erro na conexão: " + e.message;
    }
  }

  // Verifica periodicamente se a renderização no GitHub terminou para exibir o vídeo na tela
  async function iniciarVerificacaoArtefato(token) {
    const status = document.getElementById('status');
    const player = document.getElementById('player');
    const container = document.getElementById('videoContainer');

    let tentativas = 0;
    const maxTentativas = 30; // 2.5 minutos de checagem

    const interval = setInterval(async () => {
      tentativas++;
      status.innerHTML = `⏳ Processando vídeo... (${tentativas * 5}s)`;

      try {
        const res = await fetch('https://api.github.com/repos/paginainsta32-bit/meuger/actions/runs?per_page=1', {
          headers: { 'Authorization': `token ${token}` }
        });
        const data = await res.json();

        if (data.workflow_runs && data.workflow_runs.length > 0) {
          const run = data.workflow_runs[0];
          if (run.status === 'completed') {
            clearInterval(interval);
            if (run.conclusion === 'success') {
              status.innerHTML = "🎉 Vídeo concluído com sucesso!";
              // Busca o link do artefato
              const artRes = await fetch(run.artifacts_url, {
                headers: { 'Authorization': `token ${token}` }
              });
              const artData = await artRes.json();
              if (artData.artifacts && artData.artifacts.length > 0) {
                status.innerHTML = "🎉 Vídeo pronto! Clique no botão abaixo para baixar ou veja no GitHub.";
              }
            } else {
              status.innerHTML = "❌ A renderização falhou no GitHub. Verifique os logs na aba Actions.";
            }
          }
        }
      } catch (err) {
        console.error(err);
      }

      if (tentativas >= maxTentativas) {
        clearInterval(interval);
        status.innerHTML = "⏱️ Tempo limite atingido. Verifique o resultado direto no GitHub Actions.";
      }
    }, 5000);
  }
</script>

</body>
</html>
